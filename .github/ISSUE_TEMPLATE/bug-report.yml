name: Bug report
description: Report a problem with a GL-X3000 image from this repository
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happens
      description: What goes wrong, and what you expected instead.
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Image release
      description: |
        The release you flashed (e.g. `jeeves-r14`) and its revision:
        ```. /etc/openwrt_release && echo $DISTRIB_REVISION```
    validations:
      required: true
  - type: input
    id: modem
    attributes:
      label: Modem firmware
      description: |
        ```quectel-at ATI```
  - type: input
    id: carrier
    attributes:
      label: Carrier and country
  - type: textarea
    id: changes
    attributes:
      label: Changes to the image
      description: Packages added with `apk`, and settings you changed that matter here (SQM, cell locks, APN, ...).
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The relevant part of `logread` and `dmesg`. Remove anything private (IMEI, IMSI, phone number, public IP).
      render: text
